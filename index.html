<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tortilla CO2 table</title>
<meta name="theme-color" content="#9AD8F7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tortilla CO2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<style>
  :root{
    --sea-top:#9AD8F7; --sea:#6CBDEF; --sea-bot:#4CA3E5; --ink:#1E77D0; --sheet:#3F93DB;
    --hold:#E0313B; --breath:#1E9E57;
    --line:rgba(255,255,255,.42); --soft:rgba(40,120,200,.14); --dim:rgba(255,255,255,.9);
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
    --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
    --num: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--sea);color:#fff;overscroll-behavior:none}
  body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",Roboto,sans-serif;
       -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;
         -webkit-user-select:none;user-select:none}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

  /* ---------- app shell ---------- */
  #app{position:fixed;inset:0;display:flex;flex-direction:column;
       background:
         radial-gradient(90% 45% at 50% -8%,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 70%),
         linear-gradient(104deg,transparent 18%,rgba(255,255,255,.13) 24%,transparent 31%,transparent 58%,rgba(255,255,255,.1) 64%,transparent 70%),
         linear-gradient(180deg,var(--sea-top) 0%,var(--sea) 42%,var(--sea-bot) 100%)}
  #app main,#app nav{text-shadow:0 1px 3px rgba(18,84,150,.28)}
  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
       padding:calc(var(--sat) + 14px) calc(var(--sar) + 20px) 24px calc(var(--sal) + 20px)}
  .wrap{max-width:460px;margin:0 auto}
  header.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  header.top .logo{width:42px;height:42px;border-radius:11px;flex:none;box-shadow:0 3px 12px rgba(20,90,160,.25)}
  header.top h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.01em;line-height:1.15}
  header.top p{margin:2px 0 0;font-size:12.5px;color:var(--dim)}
  header.top .grow{flex:1;min-width:0}
  .icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.24);flex:none}
  .icon-btn svg{width:22px;height:22px}

  .view[hidden]{display:none!important}

  /* ---------- setup ---------- */
  .card{background:var(--soft);border:1px solid var(--line);border-radius:22px;padding:14px 14px 12px;margin-bottom:12px}
  .card .lbl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding-left:6px}
  .card .lbl i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .stepper{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
  .step{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.26);display:grid;place-items:center;flex:none;transition:transform .08s,background .15s}
  .step svg{width:26px;height:26px}
  .step.pressing{transform:scale(.92);background:rgba(255,255,255,.42)}
  .val{flex:1;text-align:center;font-size:50px;font-weight:700;line-height:1.1;padding:4px 0;border-radius:14px}
  .val small{font-size:17px;font-weight:600;color:var(--dim);margin-left:4px;font-family:inherit}
  .val:active{background:rgba(255,255,255,.08)}
  .shake{animation:shake .25s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .hint{font-size:12px;color:var(--dim);text-align:center;margin:2px 0 0}

  .mode-ctl{margin-bottom:14px}
  .mode-ctl button[aria-pressed="true"]{text-shadow:none}
  .half{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .card.mini{padding:12px 6px 10px;min-width:0}
  .card.mini .lbl{font-size:12px;letter-spacing:.04em;padding-left:6px;white-space:nowrap;text-transform:none}
  .card.mini .step{width:36px;height:36px}
  .card.mini .step svg{width:18px;height:18px}
  .card.mini .val{font-size:clamp(24px,7.4vw,32px);min-width:0;padding:6px 0}
  .plan{background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:12px 12px 4px}
  .plan-head{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;color:var(--dim);margin:0 4px 4px}
  .plan-head #plan-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .prow{display:grid;grid-template-columns:34px 1fr 1fr 36px;gap:8px;align-items:center;padding:5px 0;border-top:1px solid rgba(255,255,255,.22)}
  .prow.phead{border-top:0;padding:2px 0 4px;font-size:12px;font-weight:700;color:var(--dim)}
  .prow.phead span{padding-left:12px}
  #plan-rows .prow:first-child{border-top:0}
  .prow b{font-size:13px;color:var(--dim);text-align:center}
  .prow i{width:8px;height:8px;border-radius:50%;flex:none}
  .cell{display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.2);font-size:19px;font-weight:700;font-family:var(--num);font-variant-numeric:tabular-nums}
  .cell:active{background:rgba(255,255,255,.36)}
  .cell.flash{animation:flash .7s ease}
  @keyframes flash{0%{background:#fff;color:var(--ink)}100%{background:rgba(255,255,255,.2)}}
  .rm{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--dim);font-size:12px;font-weight:800}
  .rm svg{width:18px;height:18px}
  .rm.armed{background:var(--hold);color:#fff;text-shadow:none}
  .add-row{width:100%;height:46px;margin:8px 0;border-radius:14px;border:1.5px dashed rgba(255,255,255,.65);font-weight:700;font-size:15px}
  .add-row[hidden]{display:none}
  .saved{margin-bottom:12px}
  .saved-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--dim);margin:0 4px 8px}
  .chip-btn{height:34px;padding:0 14px;border-radius:17px;background:#fff;color:var(--ink);font-size:13px;font-weight:800;text-shadow:none}
  .chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;max-width:200px;height:50px;padding:0 14px;border-radius:14px;background:var(--soft);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;line-height:1.2;text-align:left}
  .chip b{font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip span{font-size:11.5px;color:var(--dim)}
  .chip.on{background:#fff;color:var(--ink);text-shadow:none;border-color:#fff}
  .chip.on span{color:var(--ink);opacity:.75}
  .chips .none{font-size:13px;color:var(--dim);padding:12px 4px}
  .dock.stick{position:sticky;bottom:-24px;z-index:2;margin:14px -20px -24px;padding:6px 20px 18px;border-radius:22px 22px 0 0;
        background:rgba(64,150,222,.6);border-top:1px solid rgba(255,255,255,.4);
        -webkit-backdrop-filter:blur(16px) saturate(1.15);backdrop-filter:blur(16px) saturate(1.15);box-shadow:0 -8px 24px rgba(20,90,160,.15)}
  .dock.stick .total{padding:8px 8px 10px}
  .name-in{width:100%;height:56px;border-radius:14px;border:0;background:#fff;color:var(--ink);font-size:18px;font-weight:700;padding:0 16px}
  .chk{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:15px;font-weight:600}
  .chk input{width:22px;height:22px;accent-color:#fff;flex:none}
  .mini-rows{max-height:34dvh;overflow:auto;margin:6px 0 4px}
  .mini-rows div{display:grid;grid-template-columns:34px 1fr 1fr;padding:6px 0;border-top:1px solid rgba(255,255,255,.22);font-size:16px;font-weight:700}
  .mini-rows div:first-child{border-top:0}
  .mini-rows b{color:var(--dim);font-size:13px}
  .mini-rows i{width:8px;height:8px;border-radius:50%;flex:none}
  .mini-rows span{display:flex;align-items:center;gap:7px}
  .btn-danger{background:var(--hold)!important;color:#fff}
  .total{display:flex;justify-content:space-between;align-items:baseline;padding:8px 8px 18px}
  .total b{font-size:22px}
  .total span{font-size:13px;color:var(--dim)}

  .start{width:100%;height:68px;border-radius:34px;background:#fff;color:var(--ink);text-shadow:none;font-size:22px;font-weight:800;
         display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 30px rgba(20,90,160,.28);transition:transform .1s}
  .start:active{transform:scale(.97)}
  .start svg{width:24px;height:24px}

  /* ---------- tab bar ---------- */
  nav.tabs{display:flex;background:rgba(255,255,255,.16);border-top:1px solid rgba(255,255,255,.4);
           padding:6px calc(var(--sar) + 12px) calc(var(--sab) + 6px) calc(var(--sal) + 12px)}
  nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:rgba(255,255,255,.7);font-size:12px;font-weight:700}
  nav.tabs button svg{width:26px;height:26px}
  nav.tabs button[aria-selected="true"]{color:#fff}

  /* ---------- log ---------- */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
  .stat{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:12px 10px}
  .stat b{display:block;font-size:24px;font-weight:700;line-height:1.1}
  .stat span{font-size:12px;color:var(--dim)}
  .day{font-size:13px;font-weight:700;color:var(--dim);margin:18px 6px 8px;letter-spacing:.02em}
  .entry{display:flex;align-items:center;gap:12px;background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:12px 10px 12px 14px;margin-bottom:8px}
  .entry .time{font-size:22px;font-weight:700;width:64px;flex:none}
  .entry .mid{flex:1;min-width:0}
  .entry .mid .t1{font-size:14px;font-weight:600}
  .entry .mid .t2{font-size:12.5px;color:var(--dim);margin-top:2px}
  .badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
  .badge.ok{background:#fff;color:var(--ink);text-shadow:none}
  .badge.part{background:rgba(255,255,255,.3);color:#fff}
  .del{height:36px;min-width:36px;border-radius:18px;display:grid;place-items:center;color:var(--dim);flex:none;padding:0 8px;font-size:13px;font-weight:700}
  .del svg{width:19px;height:19px}
  .del.armed{background:var(--hold);color:#fff}
  .empty{text-align:center;color:var(--dim);padding:50px 20px;font-size:15px;line-height:1.6}
  .empty svg{width:56px;height:56px;opacity:.6;margin-bottom:10px}
  .sync{font-size:12px;color:var(--dim);text-align:center;margin:22px 0 6px}

  /* ---------- session ---------- */
  #session{position:fixed;inset:0;z-index:20;background:var(--hold);display:flex;flex-direction:column;align-items:center;
           padding:calc(var(--sat) + 12px) calc(var(--sar) + 18px) calc(var(--sab) + 16px) calc(var(--sal) + 18px);
           transition:background-color .25s ease}
  #session[hidden]{display:none}
  #session.breath{background:var(--breath)}
  .s-top{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center}
  .s-set{font-size:17px;font-weight:700;letter-spacing:.06em}
  .s-set b{font-size:24px}
  .stop{height:42px;padding:0 18px;border-radius:21px;background:rgba(0,0,0,.18);font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;transition:background .15s}
  .stop svg{width:16px;height:16px}
  .stop.armed{background:#fff;color:#111}
  .s-body{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:min(1.6dvh,14px)}
  .phase{font-size:clamp(44px,14vw,72px);font-weight:900;letter-spacing:.1em;line-height:1;margin-left:.1em}
  .dial{width:min(76vw,44dvh,400px);height:auto;display:block;overflow:visible}
  .dial .el{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:700;fill:#fff}
  .remain-lbl{font-size:14px;font-weight:700;letter-spacing:.16em;color:rgba(255,255,255,.85);margin-top:4px}
  .remain{font-size:min(24vw,13dvh,140px);font-weight:800;line-height:.95}
  .s-bottom{width:100%;max-width:520px}
  .next{display:flex;justify-content:center;gap:8px;font-size:15px;font-weight:600;color:rgba(255,255,255,.9);margin-bottom:12px}
  .next b{font-weight:800}
  .segs{display:flex;gap:3px}
  .seg{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.28);overflow:hidden}
  .seg i{display:block;height:100%;width:0;background:#fff}
  .seg.done i{width:100%}
  .awake-note{font-size:12px;color:rgba(255,255,255,.85);text-align:center;margin-top:10px}

  /* ---------- finish ---------- */
  #finish{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(40,120,200,.5);text-shadow:0 1px 3px rgba(18,84,150,.3);
          -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .3s ease}
  #finish[hidden]{display:none}
  #finish .box{text-align:center;padding:30px 26px;max-width:340px}
  #finish .ring{width:110px;height:110px;margin:0 auto 18px;border-radius:50%;background:#fff;display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  #finish .ring svg{width:58px;height:58px;color:var(--ink)}
  #finish h2{font-size:46px;margin:0;font-weight:900;letter-spacing:.02em}
  #finish p{margin:4px 0 0;font-size:24px;font-weight:700}
  #finish .sum{font-size:14px;color:var(--dim);margin-top:14px;font-weight:500}
  #finish button{margin-top:26px;height:52px;padding:0 40px;border-radius:26px;background:#fff;color:var(--ink);font-weight:800;font-size:17px;text-shadow:none}
  @keyframes fade{from{opacity:0}}
  @keyframes pop{from{transform:scale(.4);opacity:0}}

  /* ---------- sheet ---------- */
  #sheet{position:fixed;inset:0;z-index:40;background:rgba(10,50,100,.4);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
  #sheet[hidden]{display:none}
  .sheet{width:100%;max-width:520px;background:var(--sheet);border-radius:26px 26px 0 0;
         padding:10px calc(var(--sar) + 22px) calc(var(--sab) + 20px) calc(var(--sal) + 22px);animation:up .25s ease}
  @keyframes up{from{transform:translateY(40px);opacity:.4}}
  .sheet .handle{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:0 auto 14px}
  .sheet h3{margin:0 0 16px;font-size:18px}
  .tin{display:flex;align-items:center;justify-content:center;gap:10px}
  .tin label{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--dim)}
  .tin input{width:110px;height:76px;border-radius:18px;border:0;background:#fff;color:var(--ink);text-align:center;
             font:700 44px var(--num);font-variant-numeric:tabular-nums}
  .tin .colon{font:700 44px var(--num);margin-bottom:24px}
  .sheet select{width:100%;height:52px;border-radius:14px;border:0;background:#fff;color:#0a2a66;font-size:16px;padding:0 12px}
  .sheet .row{margin-bottom:14px}
  .sheet .row .sub{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.5}
  .actions{display:flex;gap:10px;margin-top:22px}
  .actions button{flex:1;height:54px;border-radius:27px;font-weight:800;font-size:17px}
  .btn-ghost{background:rgba(255,255,255,.2)}
  .btn-solid{background:#fff;color:var(--ink)}
  .btn-line{height:46px;padding:0 18px;border-radius:23px;background:rgba(255,255,255,.2);font-weight:700;display:inline-flex;align-items:center;gap:8px}
  .btn-line svg{width:18px;height:18px}

  .vname{font-size:24px;font-weight:800}
  .vname span{font-size:13px;font-weight:600;opacity:.85;margin-left:8px}
  .seg-ctl{display:flex;gap:4px;background:rgba(255,255,255,.18);border-radius:16px;padding:4px}
  .seg-ctl button{flex:1;height:46px;border-radius:12px;font-weight:700;font-size:15px}
  .seg-ctl button[aria-pressed="true"]{background:#fff;color:var(--ink)}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div id="app">
  <main>
    <div class="wrap">
      <header class="top">
        <svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><defs> <linearGradient id="h-sea" x1="0" y1="0" x2="0" y2="1"> <stop offset="0" stop-color="#B4E7FB"/> <stop offset="0.45" stop-color="#7FCBF3"/> <stop offset="1" stop-color="#4FA8E6"/> </linearGradient> <linearGradient id="h-ray" x1="0" y1="0" x2="0" y2="1"> <stop offset="0" stop-color="#fff" stop-opacity="0.45"/> <stop offset="1" stop-color="#fff" stop-opacity="0"/> </linearGradient> </defs> <rect width="512" height="512" fill="url(#h-sea)"/> <g fill="url(#h-ray)" opacity="0.55"> <polygon points="120,0 180,0 120,360 70,360"/> <polygon points="250,0 290,0 300,300 250,300"/> <polygon points="370,0 420,0 470,330 420,330"/> </g> <g transform="translate(372 426) rotate(7) scale(0.62)" fill="#2C7DC8" opacity="0.45"> <path d="M-8 -38 C-10 -46 -12 -53 -17 -54 C-24 -53 -25 -45 -22 -36 C-48 -36 -92 -14 -128 14 C-98 18 -62 24 -40 34 C-28 40 -16 50 0 54 C16 50 28 40 40 34 C62 24 98 18 128 14 C92 -14 48 -36 22 -36 C25 -45 24 -53 17 -54 C12 -53 10 -46 8 -38 C3 -40 -3 -40 -8 -38 Z"/> <path d="M0 50 Q4 92 -3 140" fill="none" stroke="#2C7DC8" stroke-width="5" stroke-linecap="round"/> </g> <g fill="none" stroke="#fff" stroke-opacity="0.75" stroke-width="5"> <circle cx="108" cy="112" r="13"/> <circle cx="140" cy="76" r="8"/> <circle cx="122" cy="48" r="5"/> </g> <path fill="#fff" fill-rule="evenodd" d=" M256 178 C312 168 370 164 404 168 C434 172 448 192 446 222 L444 252 C442 292 418 318 378 322 C342 326 312 318 292 304 C280 296 268 292 256 292 C244 292 232 296 220 304 C200 318 170 326 134 322 C94 318 70 292 68 252 L66 222 C64 192 78 172 108 168 C142 164 200 168 256 178 Z M276 198 C316 190 360 188 396 191 C414 193 424 205 423 224 L422 248 C420 278 402 297 374 299 C346 301 320 294 304 282 C290 272 280 258 277 240 Z M236 198 C196 190 152 188 116 191 C98 193 88 205 89 224 L90 248 C92 278 110 297 138 299 C166 301 192 294 208 282 C222 272 232 258 235 240 Z"/> <g stroke="#fff" stroke-linecap="round" opacity="0.55"> <line x1="320" y1="270" x2="344" y2="220" stroke-width="10"/> <line x1="134" y1="270" x2="158" y2="220" stroke-width="10"/> </g></svg>
        <div class="grow">
          <h1 id="title-main">Tortilla CO2 table</h1>
          <p id="subtitle">CO2 테이블 타이머</p>
        </div>
        <button class="icon-btn" id="btn-settings" aria-label="음성 설정">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        </button>
      </header>

      <!-- TIMER SETUP -->
      <section class="view" id="view-timer">
        <div class="seg-ctl mode-ctl" role="group" aria-label="테이블 방식">
          <button data-mode="fixed" aria-pressed="true">원 브레스</button>
          <button data-mode="co2" aria-pressed="false">CO2 테이블</button>
        </div>
        <div id="mode-fixed">
          <div class="card" data-key="hold">
            <div class="lbl"><i style="background:var(--hold)"></i>Hold</div>
            <div class="stepper">

  timeSheet(`${i + 1}세트 ${f === 'hold' ? 'Hold' : 'Breath'}`, r[i][f], (v, w) => {
    v = clamp('row', v);
    const rest = w.querySelector('#in-rest'), to = rest && rest.checked ? n : i + 1;

}

/* ---- saved tables (device + Claude account when available) ---- */
function validTable(t) { return !!(t && typeof t.id === 'string' && typeof t.name === 'string' && Array.isArray(t.rows) && t.rows.length); }
const Tables = {
  items: (store.get('tco2.tables', []) || []).filter(validTable),
  ready: false, q: Promise.resolve(),
  saveLocal() { store.set('tco2.tables', this.items); },
  sorted() { return this.items.slice().sort((a, b) => (b.updated || 0) - (a.updated || 0)); },
  upsert(name, rows) {
    let t = this.items.find(x => x.name === name);
    if (t) { t.rows = rows; t.updated = Date.now(); t.pending = true; }
    else { t = { id: 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, rows, updated: Date.now(), pending: true }; this.items.push(t); }
    this.saveLocal(); this.sync(); return t;
  },
  remove(id) { this.items = this.items.filter(t => t.id !== id); this.saveLocal(); this.sync(); },
  sync() {
    if (!this.ready || !Log.cloud) return;
    const run = async () => {
      const items = this.items.map(({ pending, ...r }) => r);
      try {
        await Log.cloud.doc('tables').set({ items, updated: Date.now() });
        this.items.forEach(t => { if (items.some(x => x.id === t.id && x.updated === t.updated)) delete t.pending; });
        this.saveLocal();
      } catch (e) {}
    };
    this.q = this.q.then(run, run);
  },
  fromCloud(body, first) {
    const cloud = body && Array.isArray(body.items) ? body.items.filter(validTable) : null;
    if (!cloud) { if (first && this.items.length) { this.items.forEach(t => { t.pending = true; }); this.sync(); } return; }
    const pend = new Map(this.items.filter(t => t.pending).map(t => [t.id, t]));
    const ids = new Set(cloud.map(t => t.id));
    this.items = cloud.map(t => pend.get(t.id) || Object.assign({}, t)).concat([...pend.values()].filter(t => !ids.has(t.id)));
    this.saveLocal();
    if (cfg.mode === 'co2') renderTables();
    if (first && pend.size) this.sync();
  }
};
function renderTables() {
  const host = $('#table-chips'), list = Tables.sorted();
  if (!list.length) { host.innerHTML = '<div class="none">아직 저장된 테이블이 없어요 — 표를 만든 뒤 저장해 두세요</div>'; return; }
  host.innerHTML = list.map(t => {
    const on = cfg.co2.src === t.id && !cfg.co2.dirty;
    return `<button class="chip${on ? ' on' : ''}" data-id="${esc(t.id)}"><b>${esc(t.name)}</b><span class="num">${t.rows.length}세트 · ${fmt(sumOf(t.rows, 'hold') + sumOf(t.rows, 'breath'))}</span></button>`;
  }).join('');
}
function loadTable(t) {
  cfg.co2.rows = cleanRows(t.rows); cfg.co2.name = t.name; cfg.co2.src = t.id; cfg.co2.dirty = false;
  saveCfg(); renderCfg();
}
$('#table-chips').addEventListener('click', e => {

      ${cfg.co2.dirty ? '<div class="sub">지금 편집 중인 표의 바뀐 내용은 아직 저장되지 않았어요. 불러오면 사라져요.</div>' : ''}</div>`;

/* ================= audio: voice + fallback tones ================= */
let actx = null;
function unlockAudio() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC && !actx) actx = new AC();
    if (actx && actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
function tone(freqs, dur = 0.18, gap = 0.07) {
  if (!actx) return;
  try {
    let t = actx.currentTime + 0.02;
    for (const f of freqs) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
      t += dur + gap;
    }
  } catch (e) {}
}
const TONES = { Hold: [880, 880], Breath: [587], finish: [523, 659, 784, 1047] };

const FEMALE = /\b(samantha|karen|moira|tessa|fiona|victoria|serena|allison|ava|susan|zoe|nicky|kate|veena|zira|hazel|heera|aria|jenny|libby|sonia|natasha|clara|emma|michelle|joanna|salli|kimberly|kendra|ivy|amy|catherine|flo|sandy|shelley|martha|nora|olivia|evie|isha|female)\b/i;
const MALE = /\b(daniel|alex|fred|tom|aaron|arthur|rishi|gordon|david|mark|guy|ryan|oliver|thomas|george|james|albert|bruce|ralph|junior|eddy|reed|rocko|grandpa|lee|male|man)\b/i;
const NOVELTY = /\b(bad news|bells|boing|bubbles|cellos|wobble|zarvox|trinoids|whisper|jester|organ|superstar|bahh|good news|deranged|hysterical|pipe organ)\b/i;
const Voice = {
  ok: 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window,
  list: [], chosen: null,
  init() {
    if (!this.ok) return;
    const load = () => {
      try {
        this.list = speechSynthesis.getVoices().filter(v => /^en([-_]|$)/i.test(v.lang) && !NOVELTY.test(v.name));
      } catch (e) { this.list = []; }
      this.pick();
    };
    load();
    try { speechSynthesis.addEventListener('voiceschanged', load); } catch (e) { speechSynthesis.onvoiceschanged = load; }
  },
  // voice is fixed to Tessa; brightness = pitch/rate on top of it
  TONES: { soft: { label: '자연스럽게', pitch: 1.1, rate: 1.0 }, bright: { label: '밝게', pitch: 1.24, rate: 1.05 }, brighter: { label: '더 밝게', pitch: 1.38, rate: 1.08 } },
  tone() { return this.TONES[cfg.tone] || this.TONES.bright; },
  isTessa() { return !!(this.chosen && /\btessa\b/i.test(this.chosen.name)); },
  score(v) {
    const id = v.name + ' ' + v.voiceURI;
    let s = 0;
    if (/\btessa\b/i.test(v.name)) s += 1000;
    if (/^en[-_]za/i.test(v.lang)) s += 30;
    if (/female/i.test(id)) s += 100;
    else if (FEMALE.test(v.name)) s += 80;
    if (/x-(sfg|iob|iog|tpc|tpf)/i.test(v.voiceURI)) s += 60;
    if (/\bmale\b/i.test(id) && !/female/i.test(id)) s -= 200;
    else if (MALE.test(v.name)) s -= 150;
    if (/x-(iol|iom|tpd)/i.test(v.voiceURI)) s -= 150;
    if (/^en[-_]us/i.test(v.lang)) s += 12; else if (/^en[-_](gb|au|ie)/i.test(v.lang)) s += 8; else s += 3;
    if (/\b(karen|moira|zoe|nicky|serena)\b/i.test(v.name)) s += 10;
    if (/enhanced|premium|natural|neural/i.test(id)) s += 20;
    if (v.localService) s += 3;
    if (v.default) s += 1;
    return s;
  },
  pick() {
    let best = null, bs = -1e9;
    for (const v of this.list) { const s = this.score(v); if (s > bs) { bs = s; best = v; } }
    this.chosen = best && bs > -100 ? best : null;
  },
  say(text, toneKey) {
    if (!this.ok) { tone(TONES[toneKey] || [700]); return; }
    try {
      const busy = speechSynthesis.speaking || speechSynthesis.pending;
      if (busy) speechSynthesis.cancel();
      const go = () => {
        const u = new SpeechSynthesisUtterance(text);
        if (this.chosen) { u.voice = this.chosen; u.lang = this.chosen.lang; } else u.lang = 'en-US';
        const t = this.tone();
        u.rate = t.rate; u.pitch = t.pitch; u.volume = 1;
        u.onerror = ev => { if (ev && ev.error !== 'interrupted' && ev.error !== 'canceled') tone(TONES[toneKey] || [700]); };
        speechSynthesis.speak(u);
        if (speechSynthesis.paused) speechSynthesis.resume();
      };
      busy ? setTimeout(go, 80) : go();
    } catch (e) { tone(TONES[toneKey] || [700]); }
  }
};
Voice.init();

/* ================= keep screen awake ================= */
const Awake = {
  lock: null, video: null, active: false,
  async on() {
    this.active = true;
    try {
      if ('wakeLock' in navigator) {
        this.lock = await navigator.wakeLock.request('screen');
        this.lock.addEventListener('release', () => { this.lock = null; });
        return true;
      }
    } catch (e) {}
    try {
      if (!this.video) {
        const v = document.createElement('video');
        v.setAttribute('playsinline', ''); v.setAttribute('muted', ''); v.muted = true; v.loop = true;
        v.setAttribute('aria-hidden', 'true');
        v.style.cssText = 'position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0.01;pointer-events:none';
        v.src = NOSLEEP_SRC; document.body.append(v); this.video = v;
      }
      await this.video.play();
      return true;
    } catch (e) { return false; }
  },
  off() {
    this.active = false;
    try { this.lock && this.lock.release(); } catch (e) {}
    this.lock = null;
    try { this.video && this.video.pause(); } catch (e) {}
  }
};

/* ================= session engine ================= */
const S = { running: false, phases: [], t0: 0, total: 0, idx: -1, iv: 0, raf: 0, start: null, c: null, last: {} };
const now = () => Date.now();
const ARC_C = 2 * Math.PI * 128;
(function buildTicks() {
  let h = '';
  for (let i = 0; i < 60; i++) {
    const major = i % 5 === 0, a = i * 6;
    h += `<line transform="rotate(${a})" x1="0" y1="${major ? -96 : -102}" x2="0" y2="-112" stroke="#fff" stroke-width="${major ? 3.5 : 1.8}" stroke-linecap="round" opacity="${major ? 1 : .6}"/>`;
  }
  $('#ticks').innerHTML = h;
  $('#arc').setAttribute('stroke-dasharray', ARC_C.toFixed(2));
})();

function buildPhases(pl) {
  const out = []; let t = 0;
  pl.forEach((x, k) => {
    out.push({ type: 'hold', set: k + 1, dur: x.hold, start: t, end: (t += x.hold) });
    out.push({ type: 'breath', set: k + 1, dur: x.breath, start: t, end: (t += x.breath) });
  });
  return out;
}
function holdText(x) { return Array.isArray(x.rows) ? span(x.rows.map(r => r.hold)) : fmt(x.hold); }
function breathText(x) {
  if (Array.isArray(x.rows)) return span(x.rows.map(r => r.breath));
  return x.mode === 'co2' && x.breathEnd != null && x.breathEnd !== x.breath ? `${fmt(x.breath)}→${fmt(x.breathEnd)}` : fmt(x.breath);
}
function setText(el, v) { if (S.last[el] !== v) { S.last[el] = v; $(el).textContent = v; } }

function startSession() {
  if (S.running) return;
  unlockAudio();
  const pl = plan();
  S.c = { mode: cfg.mode, hold: pl[0].hold, breath: pl[0].breath, breathEnd: pl[pl.length - 1].breath, sets: pl.length };
  if (cfg.mode === 'co2') { S.c.rows = pl; S.c.name = cfg.co2.name || ''; }
  S.phases = buildPhases(pl);
  S.total = S.phases[S.phases.length - 1].end;
  S.t0 = now(); S.start = new Date(S.t0); S.idx = -1; S.last = {}; S.running = true;
  $('#s-sets').textContent = S.c.sets;
  $('#segs').innerHTML = S.phases.map(() => '<div class="seg"><i></i></div>').join('');
  $('#session').hidden = false;
  resetStop();
  Awake.on().then(ok => { $('#awake-note').hidden = ok; });
  tick();
  S.iv = setInterval(tick, 200);
  const loop = () => { if (!S.running) return; tick(); if (S.running) draw(); S.raf = requestAnimationFrame(loop); };
  S.raf = requestAnimationFrame(loop);
}
function elapsed() { return (now() - S.t0) / 1000; }
function tick() {
  if (!S.running) return;
  const e = elapsed();
  if (e >= S.total) { endSession(true); return; }
  let i = S.idx < 0 ? 0 : S.idx;
  while (i < S.phases.length - 1 && e >= S.phases[i].end) i++;
  if (i !== S.idx) enterPhase(i);
}
function enterPhase(i) {
  const prev = S.idx; S.idx = i;
  const p = S.phases[i], hold = p.type === 'hold';
  const ses = $('#session');
  ses.classList.toggle('breath', !hold);
  $('#hand-dot').style.fill = hold ? 'var(--hold)' : 'var(--breath)';
  try { document.querySelector('meta[name="theme-color"]').setAttribute('content', hold ? '#E0313B' : '#1E9E57'); } catch (e) {}
  setText('#s-phase', hold ? 'HOLD' : 'BREATH');
  setText('#s-set', String(p.set));
  const n = S.phases[i + 1];
  setText('#s-next', n ? `${n.type === 'hold' ? 'Hold' : 'Breath'} ${fmt(n.dur)}` : 'Finish');
  $$('#segs .seg').forEach((s, k) => { s.classList.toggle('done', k < i); s.firstChild.style.width = k < i ? '100%' : '0'; });
  Voice.say(hold ? 'Hold!' : 'Breath!', hold ? 'Hold' : 'Breath');
  try { navigator.vibrate && navigator.vibrate(hold ? [180, 80, 180] : 250); } catch (e) {}
  draw();
}
function draw() {
  const p = S.phases[S.idx]; if (!p) return;
  const e = Math.min(p.dur, Math.max(0, elapsed() - p.start));
  const frac = p.dur ? e / p.dur : 1;
  $('#arc').setAttribute('stroke-dashoffset', (ARC_C * (1 - frac)).toFixed(2));
  $('#arc').style.opacity = frac < 0.004 ? 0 : 1;
  $('#hand').setAttribute('transform', `rotate(${((e % 60) / 60 * 360).toFixed(2)})`);
  setText('#d-el', fmt(Math.floor(e)));
  setText('#s-remain', fmt(Math.ceil(p.dur - e - 1e-6)));
  const seg = $('#segs').children[S.idx]; if (seg) seg.firstChild.style.width = (frac * 100).toFixed(1) + '%';
}
function holdsDone(e) { return S.phases.filter(p => p.type === 'hold' && p.end <= e + 1e-6).length; }
function endSession(complete) {
  if (!S.running) return;
  const e = Math.min(S.total, elapsed());
  S.running = false; clearInterval(S.iv); cancelAnimationFrame(S.raf);
  Awake.off();
  $('#session').hidden = true;
  try { document.querySelector('meta[name="theme-color"]').setAttribute('content', '#9AD8F7'); } catch (e) {}
  const done = complete ? S.c.sets : holdsDone(e);
  if (complete || e >= 10) {
    const entry = {
      id: 's' + S.t0.toString(36) + Math.random().toString(36).slice(2, 6),
      start: S.start.toISOString(), end: new Date().toISOString(),
      mode: S.c.mode, hold: S.c.hold, breath: S.c.breath, breathEnd: S.c.breathEnd, sets: S.c.sets, holdsDone: done,
      holdTime: S.phases.filter(p => p.type === 'hold' && (complete || p.end <= e + 1e-6)).reduce((t, p) => t + p.dur, 0),
      complete: !!complete, dur: Math.round(e)
    };
    if (S.c.rows) { entry.rows = S.c.rows; if (S.c.name) entry.table = S.c.name; }
    Log.add(entry);
  }
  if (complete) {
    Voice.say('Finish! Well done!', 'finish');
    $('#f-sum').textContent = `${S.c.mode === 'co2' ? 'CO2 테이블' + (S.c.name ? ' · ' + S.c.name : '') + ' · ' : ''}Hold ${holdText(S.c)} · Breath ${breathText(S.c)} · ${S.c.sets}세트 · ${fmt(S.total)}`;
    $('#finish').hidden = false;
  } else {
    try { speechSynthesis.cancel(); } catch (e) {}
  }
}
let stopArmed = 0;
function resetStop() { clearTimeout(stopArmed); stopArmed = 0; const b = $('#btn-stop'); b.classList.remove('armed'); b.lastChild.textContent = '종료'; }
$('#btn-stop').addEventListener('click', () => {
  const b = $('#btn-stop');

/* ================= log (device + Claude account when available) ================= */
const Log = {
  entries: store.get('tco2.log', []).filter(x => x && x.id && x.start),
  cloud: null, cdocs: new Map(), ready: false, q: Promise.resolve(), mode: 'local',
  saveLocal() { store.set('tco2.log', this.entries); },
  month(iso) { const d = new Date(iso); return `log-${d.getFullYear()}-${pad(d.getMonth() + 1)}`; },
  clean(x) { const { pending, ...r } = x; return r; },
  add(x) {
    this.entries.push(Object.assign({}, x, { pending: true }));
    this.saveLocal(); renderLog();
    if (this.ready) this.push(x);
  },
  push(x) {
    const mid = this.month(x.start);
    return this.write(mid, arr => arr.some(y => y.id === x.id) ? arr : arr.concat([this.clean(x)]))
      .then(ok => { if (ok) { const l = this.entries.find(y => y.id === x.id); if (l) { delete l.pending; this.saveLocal(); } } });
  },
  remove(id) {
    const x = this.entries.find(y => y.id === id); if (!x) return;
    this.entries = this.entries.filter(y => y.id !== id); this.saveLocal(); renderLog();
    if (this.ready) this.write(this.month(x.start), arr => arr.filter(y => y.id !== id));
  },
  write(mid, fn) {
    const run = async () => {
      const cur = (this.cdocs.get(mid) || []).slice();
      const next = fn(cur);
      try {
        const ref = this.cloud.doc(mid);
        if (next.length) await ref.set({ entries: next, updated: Date.now() }); else await ref.delete();
        this.cdocs.set(mid, next); return true;
      } catch (e) { return false; }
    };
    const p = this.q.then(run, run); this.q = p.catch(() => {}); return p;
  },
  merge() {
    const cloudAll = []; this.cdocs.forEach(arr => arr.forEach(x => x && x.id && cloudAll.push(x)));
    const ids = new Set(cloudAll.map(x => x.id));
    const pend = this.entries.filter(x => x.pending && !ids.has(x.id));
    this.entries = cloudAll.map(x => Object.assign({}, x)).concat(pend);
    this.saveLocal(); renderLog();
  },
  async initCloud() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    let db = null, user = null, uid = null;
    try { [db, user] = await Promise.all([c.use('db'), c.use('user')]); } catch (e) { return; }
    if (!db || !user) return;
    try { uid = await user.id(); } catch (e) {}
    if (!uid) return;
    try { this.cloud = db.collection('data/users/' + uid); } catch (e) { return; }
    this.mode = 'loading'; renderSync();
    const timer = setTimeout(() => { if (!this.ready) { this.mode = 'slow'; renderSync(); } }, 10000);
    this.cloud.onSnapshot(snap => {
      const first = !snap.metadata.fromCache && !this.ready;
      const td = snap.docs.find(d => d.id === 'tables');
      if (first) Tables.ready = true;
      if (!snap.metadata.fromCache || td) Tables.fromCloud(td ? td.data() : null, first);
      this.cdocs.clear();
      snap.docs.forEach(d => { if (d.id.startsWith('log-')) { const b = d.data(); this.cdocs.set(d.id, Array.isArray(b && b.entries) ? b.entries : []); } });
      this.merge();
      if (!snap.metadata.fromCache && !this.ready) {
        clearTimeout(timer); this.ready = true; this.mode = 'cloud'; renderSync();
        this.entries.filter(x => x.pending).forEach(x => this.push(x));
      }
    }, () => { clearTimeout(timer); this.cloud = null; this.ready = false; Tables.ready = false; this.mode = 'local'; renderSync(); });
  }
};

function renderSync() {
  $('#sync').textContent = {
    local: '기록은 이 기기에 저장돼요',
    loading: '기록 불러오는 중…',
    slow: '계정 저장소 연결 중 — 새 기록은 기기에 먼저 저장돼요',
    cloud: '기록은 Claude 계정에 저장돼요 · 다른 기기에서도 보여요'
  }[Log.mode];
}
function renderLog() {
  const list = Log.entries.slice().sort((a, b) => b.start.localeCompare(a.start));
  const comp = list.filter(x => x.complete);
  const weekAgo = Date.now() - 7 * 864e5;
  $('#st-count').textContent = comp.length;
  $('#st-week').textContent = list.filter(x => new Date(x.start).getTime() >= weekAgo).length;
  $('#st-hold').textContent = fmt(list.reduce((s, x) => s + (x.holdTime != null ? x.holdTime : (x.holdsDone || 0) * (x.hold || 0)), 0));
  const host = $('#log-list');
  if (!list.length) {
    host.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="M8 8.5h8M8 12.5h8M8 16.5h5"/></svg><br>아직 기록이 없어요.<br>타이머 탭에서 첫 테이블을 시작해 보세요.</div>`;
    return;
  }
  const thisYear = new Date().getFullYear();
  let html = '', lastDay = '';
  for (const x of list) {
    const d = new Date(x.start);
    const day = d.toDateString();
    if (day !== lastDay) {
      lastDay = day;
      const wd = d.toLocaleDateString('ko-KR', { weekday: 'short' });
      const lbl = (d.getFullYear() !== thisYear ? d.getFullYear() + '년 ' : '') + `${d.getMonth() + 1}월 ${d.getDate()}일 (${wd})`;
      html += `<div class="day">${lbl}</div>`;
    }
    const badge = x.complete ? '<span class="badge ok">완료</span>' : `<span class="badge part">중단 · Hold ${x.holdsDone}/${x.sets}</span>`;
    html += `<div class="entry" data-id="${x.id}">
      <div class="time num">${pad(d.getHours())}:${pad(d.getMinutes())}</div>
      <div class="mid"><div class="t1">${x.mode === 'co2' ? 'CO2 · ' + (x.table ? esc(x.table) + ' · ' : '') : ''}${x.sets}세트${badge}</div>
        <div class="t2 num">Hold ${holdText(x)} · Breath ${breathText(x)} · ${fmt(x.dur || 0)}</div></div>
      <button class="del" aria-label="기록 삭제"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>
    </div>`;
  }
  host.innerHTML = html;
}
$('#log-list').addEventListener('click', e => {
  const b = e.target.closest('.del'); if (!b) return;
  const id = b.closest('.entry').dataset.id;
  if (b.classList.contains('armed')) { Log.remove(id); return; }
  $$('.del.armed').forEach(x => { x.classList.remove('armed'); x.innerHTML = x.dataset.icon; });
  b.dataset.icon = b.innerHTML; b.classList.add('armed'); b.textContent = '삭제';
  setTimeout(() => { if (b.isConnected && b.classList.contains('armed')) { b.classList.remove('armed'); b.innerHTML = b.dataset.icon; } }, 3000);
});

/* ================= tabs ================= */
function showTab(name) {
  $('#view-timer').hidden = name !== 'timer';
  $('#view-log').hidden = name !== 'log';
  $('#tab-timer').setAttribute('aria-selected', name === 'timer');
  $('#tab-log').setAttribute('aria-selected', name === 'log');
  $('#subtitle').textContent = name === 'log' ? '진행 기록' : 'CO2 테이블 타이머';
  if (name === 'log') renderLog();
  $('main').scrollTop = 0;
}
$('#tab-timer').addEventListener('click', () => showTab('timer'));
$('#tab-log').addEventListener('click', () => showTab('log'));

/* ================= boot ================= */
renderCfg(); renderLog(); renderSync();
(function waitClaude(n) {
  if (window.claude && typeof window.claude.use === 'function') { Log.initCloud(); return; }
  if (n < 20) setTimeout(() => waitClaude(n + 1), 150);
})(0);
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
try {
  const top = window.top === window.self;
  if ('serviceWorker' in navigator && top && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
} catch (e) {}
window.__tco2 = { S, Log, Voice, cfg };
})();
